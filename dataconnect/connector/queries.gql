# --- DOCUMENT QUERIES ---
query FetchDocuments(
    $isArchived: Boolean
    $limit: Int = 10000
    $offset: Int = 0
) @auth(level: PUBLIC) {
    documents(
        where: { isArchived: { eq: $isArchived } }
        limit: $limit
        offset: $offset
    ) {
        id
        parent {
            id
            name
        }
        name
        comment
        isFolder
        isArchived
        directlyArchived
        createdAt
        updatedAt
    }
}

query FetchAllDocuments(
    $limit: Int = 10000
    $offset: Int = 0
) @auth(level: PUBLIC) {
    documents(
        limit: $limit
        offset: $offset
        orderBy: [{ isFolder: DESC }, { name: ASC }]
    ) {
        id
        parent {
