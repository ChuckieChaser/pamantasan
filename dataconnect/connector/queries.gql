# --- DOCUMENT QUERIES ---
query FetchDocuments(
    $isArchived: Boolean
) @auth(level: USER) {
    documents(where: { isArchived: { eq: $isArchived } }) {
        id
        parent {
            id
            name
        }
        uploader {
            id
            firstName
            lastName
            email
        }
        name
        comment
        isFolder
        isArchived
        createdAt
        updatedAt
    }
}

query FetchDocumentById(
    $id: UUID!
) @auth(level: USER) {
    documents(where: { id: { eq: $id } }) {
        id
        parent {
            id
            name
        }
        uploader {
            id
            firstName
            lastName
            email
        }
        name
        comment
        isFolder
        isArchived
        createdAt
        updatedAt
    }
}

query FetchDocumentVersions(
    $documentId: UUID!
) @auth(level: USER) {
    documentVersions(where: { document: { id: { eq: $documentId } } }, orderBy: [{ version: DESC }]) {
        id
        document {
            id
            name
        }
        uploader {
            id
            firstName
            lastName
        }
        approver {
            id
            firstName
            lastName
        }
        publisher {
            id
            firstName
            lastName
        }
        rejecter {
            id
            firstName
            lastName
        }
        version
        checksum
        path
        sizeBytes
        mimeType
        classification
        changeSummary
        rejectionReason
        summary
        textHash
        createdAt
        updatedAt
    }
}

query FetchDocumentVersionById(
    $id: UUID!
) @auth(level: USER) {
    documentVersions(where: { id: { eq: $id } }) {
        id
        document {
            id
