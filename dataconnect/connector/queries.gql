# --- DEPARTMENT QUERIES ---
query FetchDepartments @auth(level: USER) {
    departments {
        id
        name
        code
        createdAt
        updatedAt
    }
}

query FetchDepartmentById(
    $id: UUID!
) @auth(level: USER) {
    departments(where: { id: { eq: $id } }) {
        id
        name
        code
        createdAt
        updatedAt
    }
}

query FetchDepartmentByCode(
    $code: String!
) @auth(level: USER) {
    departments(where: { code: { eq: $code } }) {
        id
        name
        code
        createdAt
        updatedAt
    }
}


