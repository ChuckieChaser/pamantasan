# --- DEPARTMENT QUERIES ---
query FetchDepartments(
    $limit: Int = 10000
    $offset: Int = 0
) @auth(level: PUBLIC) {
    departments(
        limit: $limit
        offset: $offset
        orderBy: [{ name: ASC }]
    ) {
        id
        name
        code
        createdAt
        updatedAt
    }
}

query FetchDepartmentById(
    $id: UUID!
) @auth(level: PUBLIC) {
    departments(where: { id: { eq: $id } }) {
        id
        name
        code
        createdAt
        updatedAt
    }
}

query FetchDepartmentByCode(
    $code: String!
) @auth(level: PUBLIC) {
    departments(where: { code: { eq: $code } }) {
        id
        name
        code
        createdAt
        updatedAt
    }
}


# --- USER QUERIES ---
query FetchUsers(
    $limit: Int = 10000
    $offset: Int = 0
) @auth(level: PUBLIC) {
    users(
        limit: $limit
        offset: $offset
        orderBy: [{ createdAt: DESC }]
    ) {
        id
        universityId
        department {
            id
            name
            code
        }
        role
        email
        avatarPath
        firstName
        middleName
        lastName
        status
        createdAt
        updatedAt
