# --- USER MUTATIONS ---
mutation CreateUser(
    $id: UUID!
    $universityId: String!
    $departmentId: UUID!
    $role: String!
    $email: String!
    $avatar: String
    $givenName: String!
    $lastName: String!

    $passwordHash: String!
    $googleId: String
) @auth(level: USER) {
    user_insert(
        data: {
            id: $id
            universityId: $universityId
            departmentId: $departmentId
            role: $role
            email: $email
            avatar: $avatar
            givenName: $givenName
            lastName: $lastName
        }
    )
    userCredential_insert(
        data: {
            userId: $id
            passwordHash: $passwordHash
            googleId: $googleId
        }
    )
    userSetting_insert(
        data: {
            userId: $id
        }
    )
}

mutation UpdateUser(
    $id: UUID!
    $departmentId: UUID
    $role: String
    $email: String
    $avatar: String
    $givenName: String
    $lastName: String
    $status: String
    $updatedAt: Timestamp
) @auth(level: USER) {
    user_update(
        id: $id
        data: {
            departmentId: $departmentId
            role: $role
            email: $email
            avatar: $avatar
            givenName: $givenName
            lastName: $lastName
            status: $status
            updatedAt: $updatedAt
        }
    )
    userSession_deleteMany(
        where: {
            user: {
                id: { eq: $id }
                status: { eq: "SUSPENDED" }
            }
        }
    )
}

mutation UpdateUsers(
    $ids: [UUID!]!
    $departmentId: UUID
    $role: String
    $status: String
    $updatedAt: Timestamp
) @auth(level: USER) {
    user_updateMany(
        where: {
            id: { in: $ids }
        }
        data: {
            departmentId: $departmentId
            role: $role
            status: $status
            updatedAt: $updatedAt
        }
    )
    userSession_deleteMany(
        where: {
            user: {
                id: { in: $ids }
                status: { eq: "SUSPENDED" }
            }
        }
    )
}


# --- USER CREDENTIAL MUTATIONS ---
mutation UpdateUserCredential(
    $userId: UUID!
    $passwordHash: String
    $googleId: String
    $updatedAt: Timestamp
) @auth(level: USER) {
    userCredential_update(
        key: {
            userId: $userId
        }
        data: {
            passwordHash: $passwordHash
            googleId: $googleId
            updatedAt: $updatedAt
        }
    )
}


# --- USER SETTING MUTATIONS ---
mutation UpdateUserSetting(
    $userId: UUID!
    $theme: String
    $notification: String
    $updatedAt: Timestamp
) @auth(level: USER) {
    userSetting_update(
        key: {
            userId: $userId
        }
        data: {
            theme: $theme
            notification: $notification
            updatedAt: $updatedAt
        }
    )
}


# --- USER SESSION MUTATIONS ---
mutation CreateUserSession(
    $userId: UUID!
    $tokenHash: String!
    $ipAddress: String
    $userAgent: String
    $expiredAt: Timestamp
) @auth(level: USER) {
    userSession_insert(
        data: {
            userId: $userId
            tokenHash: $tokenHash
            ipAddress: $ipAddress
            userAgent: $userAgent
            expiredAt: $expiredAt
        }
    )
}

mutation UpdateUserSession(
    $id: UUID!
    $expiredAt: Timestamp!
) @auth(level: USER) {
    userSession_update(
        id: $id
        data: {
            expiredAt: $expiredAt
        }
    )
}

mutation DeleteUserSessions(
    $ids: [UUID!]!
) @auth(level: USER) {
    userSession_deleteMany(
        where: {
            id: { in: $ids }
        }
    )
}
