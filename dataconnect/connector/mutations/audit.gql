# --- AUDIT LOG MUTATIONS ---
mutation CreateAuditLog(
    $actorId: UUID
    $entityId: UUID!
    $event: String!
    $data: String!
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR', 'DIRECTOR', 'OFFICER', 'MEMBER']") {
    auditLog_insert(
        data: {
            actorId: $actorId
            entityId: $entityId
            event: $event
            data: $data
        }
    )
}
