# --- NOTIFICATION & AUDIT LOG MUTATIONS ---
mutation CreateNotification(
  $recipientId: UUID!
  $actorId: UUID
  $entityType: String!
  $entityId: UUID!
  $action: String!
  $isRead: Boolean!
  $isEmailed: Boolean!
) @auth(level: PUBLIC) {
  notification_insert(data: {
    recipientId: $recipientId
    actorId: $actorId
    entityType: $entityType
    entityId: $entityId
    action: $action
    isRead: $isRead
    isEmailed: $isEmailed
  })
}

mutation CreateAuditLog(
  $actorId: UUID
  $entityType: String!
  $entityId: UUID!
  $action: String!
  $data: String!
) @auth(level: PUBLIC) {
  auditLog_insert(data: {
    actorId: $actorId
    entityType: $entityType
    entityId: $entityId
    action: $action
    data: $data
  })
}
