# --- DEPARTMENT MUTATIONS ---
mutation InsertDepartment(
    $name: String!
    $code: String!
    $createdAt: Timestamp
    $updatedAt: Timestamp
) @auth(level: USER) {
    department_insert(
        data: {
            name: $name
            code: $code
            createdAt: $createdAt
            updatedAt: $updatedAt
        }
    )
}

mutation UpdateDepartment(
    $id: UUID!
    $name: String
    $code: String
    $updatedAt: Timestamp
) @auth(level: USER) {
    department_update(
        id: $id
        data: {
            name: $name
            code: $code
            updatedAt: $updatedAt
        }
    )
}

mutation DeleteDepartment(
    $id: UUID!
) @auth(level: USER) {
    department_delete(id: $id)
}


