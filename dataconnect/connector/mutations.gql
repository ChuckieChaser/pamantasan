    $role: String!
    $email: String!
    $avatarPath: String
    $firstName: String!
    $middleName: String
    $lastName: String!
    $status: String!
    $createdAt: Timestamp
    $updatedAt: Timestamp
) @auth(level: USER) {
    user_insert(
        data: {
            universityId: $universityId
            departmentId: $departmentId
            role: $role
            email: $email
            avatarPath: $avatarPath
            firstName: $firstName
            middleName: $middleName
            lastName: $lastName
            status: $status
            createdAt: $createdAt
            updatedAt: $updatedAt
