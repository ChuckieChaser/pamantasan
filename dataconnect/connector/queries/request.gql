# --- REQUEST QUERIES ---
query GetRequests(
    $search: String = ""
    $statuses: [String!]
    $orderBy: [Request_Order!] = [{ createdAt: DESC }]
    $limit: Int = 100
    $offset: Int = 0
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR', 'DIRECTOR', 'OFFICER']") {
    requests(
        where: {
            subject: { contains: $search }
            status: { in: $statuses }
        }
        orderBy: $orderBy
        limit: $limit
        offset: $offset
    ) {
        id
        requester {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        reviewer {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        subject
        status
        createdAt
        updatedAt
    }
}

query GetRequestsByRequesterId(
    $search: String = ""
    $requesterId: UUID!
    $statuses: [String!]
    $orderBy: [Request_Order!] = [{ createdAt: DESC }]
    $limit: Int = 100
    $offset: Int = 0
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR'] || auth.uid == string($requesterId)") {
    requests(
        where: {
            subject: { contains: $search }
            requester: { id: { eq: $requesterId } }
            status: { in: $statuses }
        }
        orderBy: $orderBy
        limit: $limit
        offset: $offset
    ) {
        id
        requester {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        reviewer {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        subject
        status
        createdAt
        updatedAt
    }
}

query GetRequestById(
    $id: UUID!
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR', 'DIRECTOR', 'OFFICER', 'MEMBER']") {
    requests(
        where: {
            id: { eq: $id }
        }
    ) {
        id
        requester {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        reviewer {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        subject
        status
        createdAt
        updatedAt
    }
}


# --- REQUEST MESSAGE QUERIES ---
query GetRequestMessagesByRequestId(
    $requestId: UUID!
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR', 'DIRECTOR', 'OFFICER', 'MEMBER']") {
    requestMessages(
        where: {
            request: { id: { eq: $requestId } }
        }
    ) {
        id
        request {
            id
            subject
            status
        }
        user {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        message
        createdAt
        updatedAt
    }
}


# --- REQUEST ATTACHMENT QUERIES ---
query GetRequestAttachmentsByRequestId(
    $requestId: UUID!
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR', 'DIRECTOR', 'OFFICER', 'MEMBER']") {
    requestAttachments(
        where: {
            request: { id: { eq: $requestId } }
        }
    ) {
        id
        request {
            id
            subject
            status
        }
        message {
            id
        }
        document {
            id
            name
            isFolder
            isArchived
        }
        attacher {
            id
            avatar
            role
            email
            givenName
            lastName
        }
        createdAt
    }
}
