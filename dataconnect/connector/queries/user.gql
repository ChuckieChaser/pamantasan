# --- USER QUERIES ---
query GetUsers(
    $search: String = ""
    $roles: [String!]
    $statuses: [String!]
    $orderBy: [User_Order!] = [{ lastName: ASC }]
    $limit: Int = 100
    $offset: Int = 0
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR', 'DIRECTOR', 'OFFICER']") {
    users(
        where: {
            _or: [
                { universityId: { contains: $search } }
                { email: { contains: $search } }
                { givenName: { contains: $search } }
                { lastName: { contains: $search } }
            ]
            role: { in: $roles }
            status: { in: $statuses }
        }
        orderBy: $orderBy
        limit: $limit
        offset: $offset
    ) {
        id
        universityId
        department {
            id
            logo
            name
            code
        }
        role
        email
        avatar
        givenName
        lastName
        status
        createdAt
        updatedAt
    }
}

query GetUsersByDepartmentId(
    $search: String = ""
    $departmentId: UUID!
    $roles: [String!]
    $statuses: [String!]
    $orderBy: [User_Order!] = [{ lastName: ASC }]
    $limit: Int = 100
    $offset: Int = 0
) @auth(expr: "auth.token.role in ['ADMINISTRATOR', 'COORDINATOR', 'DIRECTOR', 'OFFICER', 'MEMBER']") {
    users(
        where: {
            _or: [
                { universityId: { contains: $search } }
                { email: { contains: $search } }
                { givenName: { contains: $search } }
                { lastName: { contains: $search } }
            ]
            department: { id: { eq: $departmentId } }
            role: { in: $roles }
            status: { in: $statuses }
        }
        orderBy: $orderBy
        limit: $limit
        offset: $offset
    ) {
        id
        universityId
        department {
            id
            logo
            name
            code
        }
        role
        email
        avatar
        givenName
        lastName
        status
        createdAt
        updatedAt
    }
}

