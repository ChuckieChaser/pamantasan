# --- USER CREDENTIAL QUERIES ---
query GetUserCredentialByUserId(
    $userId: UUID!
) @auth(expr: "auth.token.role == 'ADMINISTRATOR'") {
    userCredentials(
        where: {
            user: { id: { eq: $userId } }
        }
    ) {
        user {
            id
        }
        googleId
        createdAt
        updatedAt
    }
}


# --- USER SETTING QUERIES ---
query GetUserSettingByUserId(
    $userId: UUID!
) @auth(expr: "auth.token.role == 'ADMINISTRATOR' || auth.uid == string($userId)") {
    userSettings(
        where: {
            user: { id: { eq: $userId } }
        }
    ) {
        user {
            id
        }
        theme
        notification
        createdAt
        updatedAt
    }
}


# --- USER SESSION QUERIES ---
query GetUserSessionsByUserId(
    $userId: UUID!
) @auth(expr: "auth.token.role == 'ADMINISTRATOR' || auth.uid == string($userId)") {
    userSessions(
        where: {
            user: { id: { eq: $userId } }
        }
    ) {
        id
        user {
            id
        }
        tokenHash
        ipAddress
        userAgent
        createdAt
        expiredAt
    }
}

