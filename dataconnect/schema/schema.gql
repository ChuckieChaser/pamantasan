# --- DEPARTMENT SCHEMA ---
type Department @table {
    name: String!
    code: String!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# --- USER SCHEMAS ---
type User @table {
    universityId: String!
    department: Department!
    role: String!
    email: String!
    avatarPath: String
    firstName: String!
    middleName: String
    lastName: String!
    status: String!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type UserCredential @table(key: ["user"]) {
    user: User!
    passwordHash: String!
    googleId: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type UserSetting @table(key: ["user"]) {
    user: User!
    theme: String!
    notification: String!
    avatar: String! @default(value: "SYSTEM")
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type UserSession @table {
    user: User!
    tokenHash: String!
    ipAddress: String
    userAgent: String
    createdAt: Timestamp! @default(expr: "request.time")
    expiredAt: Timestamp
}

# --- DOCUMENT SCHEMAS ---
type Document @table {
    parent: Document
    uploader: User!
    name: String!
    comment: String
    isFolder: Boolean!
    isArchived: Boolean!
    directlyArchived: Boolean! @default(value: false)
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type DocumentVersion @table {
    document: Document!
    uploader: User!
    approver: User
    publisher: User
    rejecter: User
    version: Int!
    checksum: String
    path: String!
    sizeBytes: Int64!
    mimeType: String!
    classification: String!
    changeSummary: String
    rejectionReason: String
    summary: String
    embedding: Vector @col(size: 768)
    textHash: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type DocumentShare @table {
    document: Document!
    sharer: User!
    recipient: User
    department: Department!
    status: String!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type DocumentRequest @table {
    requester: User!
    resolver: User
    subject: String!
    status: String!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

type DocumentRequestMessage @table {
    documentRequest: DocumentRequest!
    user: User
    message: String!
    createdAt: Timestamp! @default(expr: "request.time")
}

type DocumentRequestAttachment @table {
    documentRequest: DocumentRequest!
    document: Document!
    attachedBy: User!
    createdAt: Timestamp! @default(expr: "request.time")
}

# --- COORDINATOR REQUEST SCHEMA ---
type CoordinatorRequest @table {
    requester: User!
    reviewer: User
    action: String!
    data: String!
    status: String!
    rejectionReason: String
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# --- NOTIFICATION SCHEMA ---
type Notification @table {
    recipient: User!
    actor: User
    entityType: String!
    entityId: UUID!
    action: String!
    isRead: Boolean!
    isEmailed: Boolean!
    createdAt: Timestamp! @default(expr: "request.time")
    updatedAt: Timestamp! @default(expr: "request.time")
}

# --- AUDIT LOG SCHEMA ---
type AuditLog @table {
    actor: User
    entityType: String!
    entityId: UUID!
    action: String!
    data: String!
    createdAt: Timestamp! @default(expr: "request.time")
}
